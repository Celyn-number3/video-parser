<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Video Parser · 视频工作台学习布局原型</title>
<style>
__STYLES__
</style>
</head>
<body>
<noscript><p class="noscript">此原型需要启用 JavaScript 才能点击体验。</p></noscript>
<div class="app">
  <button class="nav-scrim" id="nav-scrim" type="button" aria-label="关闭导航菜单" hidden></button>
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="brand"><span class="brand-mark" data-icon="clapperboard"></span><strong>Video Parser</strong></div>
    <nav id="nav" aria-label="页面">
      <button class="nav-button" type="button" data-page="workspace"><span data-icon="circle-play"></span><span class="nav-label">视频工作台</span></button>
      <button class="nav-button" type="button" data-page="transcription"><span data-icon="captions"></span><span class="nav-label">字幕与转写</span></button>
      <button class="nav-button" type="button" data-page="tasks"><span data-icon="list-checks"></span><span class="nav-label">任务中心</span></button>
      <button class="nav-button" type="button" data-page="accounts"><span data-icon="user-round"></span><span class="nav-label">账号与登录</span></button>
    </nav>
    <p class="sidebar-note">独立原型 · 示例数据只在本页内存中</p>
  </aside>
  <div class="shell" id="shell">
    <header class="topbar">
      <button class="icon-button mobile-menu" id="menu-button" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button>
      <h1 class="topbar-title" id="page-title" tabindex="-1">视频工作台</h1>
      <div class="top-actions">
        <span class="proto-chip" title="独立原型，不接入真实业务">原型</span>
        <button class="icon-button" id="settings-button" type="button" aria-label="设置" title="设置"><span data-icon="settings"></span></button>
        <button class="icon-button" id="theme-button" type="button" aria-label="切换到深色主题" title="深色主题"></button>
      </div>
    </header>
    <main class="main" id="main" aria-labelledby="page-title">
      <section class="page" id="page-workspace" data-page-section="workspace">
        <form class="source-panel" id="source-form" novalidate>
          <label class="sr-only" for="source">视频链接或分享文本</label>
          <span class="source-icon" data-icon="link"></span>
          <textarea id="source" rows="1" maxlength="8192" placeholder="粘贴视频链接，或带链接的分享文本…">https://www.bilibili.com/video/BV1EXAMPLE01?p=3</textarea>
          <button class="btn primary" type="submit" id="parse-button"><span data-icon="link"></span>解析视频</button>
        </form>
        <div class="tabs" role="tablist" aria-label="内容类型">
          <button type="button" role="tab" id="tab-cover" data-tab="cover" aria-controls="tabpanel"><span data-icon="image"></span>封面图片</button>
          <button type="button" role="tab" id="tab-video" data-tab="video" aria-controls="tabpanel"><span data-icon="circle-play"></span>视频预览</button>
          <button type="button" role="tab" id="tab-ai" data-tab="ai" aria-controls="tabpanel"><span data-icon="scan-eye"></span>AI 分析</button>
        </div>
        <div class="work-grid" id="work-grid">
          <section class="preview-panel" id="tabpanel" role="tabpanel" aria-labelledby="tab-ai"></section>
          <aside class="details-panel" id="inspector" aria-labelledby="details-heading"></aside>
        </div>
      </section>
      <section class="page" id="page-transcription" data-page-section="transcription" hidden>
        <div class="placeholder-card">
          <p class="eyebrow">正式应用保持不变</p>
          <h2>字幕与转写</h2>
          <p>本原型只演示视频工作台「AI 分析」里的学习布局。B站字幕获取和本地转写保持现状。</p>
          <button class="btn primary" type="button" data-go="workspace">回到视频工作台</button>
        </div>
      </section>
      <section class="page" id="page-tasks" data-page-section="tasks" hidden>
        <div class="placeholder-card">
          <p class="eyebrow">正式应用保持不变</p>
          <h2>任务中心</h2>
          <p>下载归档和 AI 分析仍然作为处理任务显示在这里。学习布局没有新增任务类型。</p>
          <button class="btn primary" type="button" data-go="workspace">回到视频工作台</button>
        </div>
      </section>
      <section class="page" id="page-accounts" data-page-section="accounts" hidden>
        <div class="placeholder-card">
          <p class="eyebrow">正式应用保持不变</p>
          <h2>账号与登录</h2>
          <p>本原型不登录任何账号、不保存凭据；正式应用的登录与凭据管理保持原样。</p>
          <button class="btn primary" type="button" data-go="workspace">回到视频工作台</button>
        </div>
      </section>
    </main>
  </div>
</div>
<div class="toast-region" id="toast-region" aria-live="polite"></div>
<p class="sr-only" id="sr-status" aria-live="polite"></p>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div class="dialog-inner">
    <div class="dialog-head">
      <h2 id="settings-title">设置</h2>
      <button class="icon-button" type="button" data-close-dialog aria-label="关闭"><span data-icon="x"></span></button>
    </div>
    <div class="dialog-body">
      <p>默认画质、AI 模型、模型复用和缓存清理都保持正式应用现状。</p>
      <p class="muted small">本原型只保留设置入口的位置，不包含任何设置项。</p>
    </div>
    <div class="dialog-foot">
      <button class="btn primary" type="button" data-close-dialog>知道了</button>
    </div>
  </div>
</dialog>
<script>
__SCRIPT__
</script>
</body>
</html>
