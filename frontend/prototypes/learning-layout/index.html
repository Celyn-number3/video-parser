<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Video Parser · 视频工作台学习布局原型</title>
<style>
/* Video Parser · 视频工作台学习布局原型
   低保真：沿用正式前端 Mono 设计令牌（黑白灰）、侧栏 / 顶栏和视频工作台结构。 */
:root {
  --gray-0: #ffffff; --gray-50: #fafafa; --gray-100: #f4f4f4; --gray-200: #e6e6e6; --gray-300: #d4d4d4;
  --gray-400: #a3a3a3; --gray-500: #737373; --gray-600: #525252; --gray-700: #3d3d3d; --gray-800: #262626;
  --gray-900: #171717; --gray-950: #0a0a0a; --gray-1000: #000000;
  --font-sans: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
  --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, "SFMono-Regular", monospace;
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 10px;
  --sidebar-w: 232px; --topbar-h: 56px; --inspector-w: 288px; --pad-x: 28px;
}
:root, [data-theme="light"] {
  color-scheme: light;
  --bg: var(--gray-0); --surface: var(--gray-50); --sunken: var(--gray-100); --raised: var(--gray-0);
  --text: var(--gray-950); --text-2: var(--gray-600); --text-3: var(--gray-500); --text-disabled: var(--gray-400);
  --border: var(--gray-200); --border-strong: var(--gray-500); --focus: var(--gray-1000);
  --primary: var(--gray-950); --primary-hover: var(--gray-700); --on-primary: var(--gray-0);
  --hover: var(--gray-100); --disabled-fill: var(--gray-100); --overlay: rgb(0 0 0 / .45);
  --shadow-lg: 0 16px 48px rgb(0 0 0 / .16), 0 2px 6px rgb(0 0 0 / .06);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--gray-950); --surface: var(--gray-900); --sunken: var(--gray-1000); --raised: var(--gray-900);
  --text: var(--gray-50); --text-2: var(--gray-300); --text-3: var(--gray-400); --text-disabled: var(--gray-600);
  --border: var(--gray-800); --border-strong: var(--gray-500); --focus: var(--gray-0);
  --primary: var(--gray-50); --primary-hover: var(--gray-300); --on-primary: var(--gray-950);
  --hover: var(--gray-800); --disabled-fill: var(--gray-800); --overlay: rgb(0 0 0 / .7);
  --shadow-lg: 0 16px 48px rgb(0 0 0 / .8);
}

/* ---------- 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 var(--font-sans); font-synthesis: none; }
h1, h2, h3, h4, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.icon { display: block; flex: none; width: 16px; height: 16px; }
.noscript { padding: 24px; }
.eyebrow { color: var(--text-3); font-size: 12px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--raised); color: var(--text); font-weight: 500; line-height: 1.2; white-space: nowrap;
  transition: background-color .12s, border-color .12s, color .12s;
}
.btn:hover:not(:disabled):not([aria-disabled="true"]) { background: var(--hover); border-color: var(--border-strong); }
.btn:disabled, .btn[aria-disabled="true"] { cursor: not-allowed; color: var(--text-disabled); background: var(--disabled-fill); border-color: var(--border); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled):not([aria-disabled="true"]) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.primary:disabled, .btn.primary[aria-disabled="true"] { background: var(--disabled-fill); border-color: var(--border); color: var(--text-disabled); }
.btn.small { min-height: 28px; padding: 0 10px; gap: 4px; font-size: 12px; }
.btn.small .icon { width: 14px; height: 14px; }
.btn.block { width: 100%; }
.icon-button {
  display: inline-grid; place-items: center; flex: none; width: 36px; height: 36px; padding: 0;
  border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--text-2);
}
.icon-button:hover { background: var(--hover); color: var(--text); }
.time-link {
  display: inline-flex; align-items: center; min-height: 22px; margin: 0 2px; padding: 0 7px; vertical-align: 1px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  color: var(--text-2); font-family: var(--font-mono); font-size: 12px; line-height: 1; white-space: nowrap;
}
.time-link:hover { border-color: var(--border-strong); color: var(--text); }
.spin { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 应用框架（与正式前端一致：侧栏 + 顶栏） ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; display: flex; flex: none; flex-direction: column; gap: 22px;
  width: var(--sidebar-w); height: 100vh; padding: 20px 12px 16px; overflow-y: auto;
  border-right: 1px solid var(--border); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 15px; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--primary); color: var(--on-primary); }
.brand-mark .icon { width: 17px; height: 17px; }
nav { display: flex; flex-direction: column; gap: 2px; }
.nav-button {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px;
  border: 0; border-radius: var(--radius-md); background: transparent; color: var(--text-2); text-align: left;
}
.nav-button > span[data-icon] { display: inline-flex; }
.nav-button:hover { background: var(--hover); color: var(--text); }
.nav-button[aria-current="page"] { background: var(--raised); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border); }
.nav-label { flex: 1; min-width: 0; }
.sidebar-note { margin-top: auto; padding: 8px 10px 0; color: var(--text-3); font-size: 12px; }
.shell { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  height: var(--topbar-h); padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--bg);
}
.topbar-title { font-size: 16px; font-weight: 600; white-space: nowrap; }
.topbar-title:focus { outline: none; }
.topbar-title:focus-visible { outline: 2px solid var(--focus); }
.top-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.proto-chip { padding: 1px 6px; border: 1px dashed var(--border-strong); border-radius: 4px; color: var(--text-2); font-size: 11px; white-space: nowrap; }
.mobile-menu { display: none; }
.main { width: 100%; max-width: 1560px; margin: 0 auto; padding: 22px var(--pad-x) 40px; }

/* ---------- 视频工作台：链接、标签、两栏 ---------- */
.source-panel {
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; margin-bottom: 14px;
  border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--raised);
}
.source-icon { color: var(--text-3); }
.source-panel textarea {
  flex: 1; min-width: 0; height: 36px; padding: 7px 0; border: 0; background: transparent; resize: none;
  font-family: var(--font-mono); font-size: 13px; line-height: 22px; white-space: nowrap; overflow: hidden;
}
.source-panel textarea:focus { outline: none; }
.source-panel:focus-within { border-color: var(--border-strong); }
.tabs { display: flex; gap: 22px; height: 43px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.tabs button {
  position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 0 1px;
  border: 0; background: transparent; color: var(--text-3); font-size: 13px; white-space: nowrap;
}
.tabs button .icon { width: 15px; height: 15px; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--primary); }
.work-grid { display: grid; grid-template-columns: minmax(0, 1fr) var(--inspector-w); gap: 24px; align-items: start; }
.preview-panel { min-width: 0; }
.panel { min-width: 0; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--raised); }
.panel-title { margin-bottom: 12px; font-size: 14px; font-weight: 600; }

/* ---------- 画面区：封面、示例播放器、未归档 ---------- */
.media-stage {
  display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
  border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--sunken); color: var(--text-3);
}
.empty-stage { display: grid; justify-items: center; gap: 12px; padding: 16px; text-align: center; font-size: 13px; }
.empty-stage .icon { width: 28px; height: 28px; }
.cover-art { display: grid; justify-items: center; gap: 6px; padding: 16px; text-align: center; }
.cover-art strong { color: var(--text); font-size: 18px; }
.player { min-width: 0; overflow: hidden; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--sunken); }
.screen {
  position: relative; display: grid; place-items: center; align-content: center; gap: 4px; aspect-ratio: 16 / 9;
  padding: 12px; color: var(--text-3); text-align: center;
  background: repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--border) 55%, transparent) 14px 15px);
}
.screen strong { color: var(--text); font-size: 15px; font-weight: 600; }
.screen-label { padding: 0 6px; border: 1px dashed var(--border-strong); border-radius: 4px; font-size: 11px; }
.screen-time { font-family: var(--font-mono); font-size: 22px; color: var(--text); }
.controls { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-top: 1px solid var(--border); background: var(--raised); }
.controls .icon-button { width: 32px; height: 32px; color: var(--text); }
.player-time { flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
.track { position: relative; flex: 1; height: 18px; cursor: pointer; }
.track::before { content: ""; position: absolute; top: 7px; right: 0; left: 0; height: 4px; border-radius: 2px; background: var(--border); }
.track i { position: absolute; top: 7px; left: 0; height: 4px; border-radius: 2px; background: var(--primary); }
.track:focus-visible { outline-offset: 0; }
.stage-status { display: grid; gap: 8px; width: min(320px, 90%); }
.bar { height: 4px; overflow: hidden; border-radius: 2px; background: var(--border); }
.bar i { display: block; height: 100%; background: var(--primary); }

/* ---------- 学习布局：视频和笔记并排（本原型的核心改动） ---------- */
.study { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.study-media { position: sticky; top: calc(var(--topbar-h) + 14px); z-index: 6; min-width: 0; }
.study-episode { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px 0; }
.study-episode h2 { min-width: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.study-episode h2:focus { outline: none; }
.study-episode h2:focus-visible { outline: 2px solid var(--focus); }
.study-notes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.check-line { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--raised); font-size: 13px; white-space: nowrap; cursor: pointer; }
.check-line:has(input:checked) { border-color: var(--primary); }
.check-line input, .episode input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); cursor: pointer; }

/* 分析记录 */
.record-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.record-bar .panel-title { margin: 0; }
.record-bar select, .field select { min-height: 32px; max-width: 100%; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--raised); font-size: 12px; }
.record-meta { color: var(--text-3); font-size: 12px; }
.record-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.md { font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }
.md h4 { margin: 16px 0 4px; font-size: 14px; font-weight: 600; }
.md h4:first-child { margin-top: 8px; }
.md ul, .md ol { display: grid; gap: 4px; padding-left: 20px; }
.md p + p { margin-top: 6px; }
.followup { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
.followup-q { display: flex; gap: 8px; margin-bottom: 4px; font-weight: 600; }
.followup-q span { flex: none; padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-3); font-size: 11px; font-weight: 400; line-height: 20px; }
.ask { display: flex; align-items: flex-end; gap: 8px; margin-top: 14px; }
.ask textarea, .field textarea { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--raised); resize: vertical; font-size: 13px; }
.hint { margin-top: 6px; color: var(--text-3); font-size: 12px; }

/* 新建分析（已有记录时收起） */
.new-analysis summary { display: flex; align-items: center; gap: 8px; min-height: 24px; font-weight: 600; cursor: pointer; list-style: none; }
.new-analysis summary::-webkit-details-marker { display: none; }
.new-analysis summary::before { content: "+"; display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border-strong); border-radius: 4px; font-weight: 400; line-height: 1; }
.new-analysis[open] summary::before { content: "−"; }
.new-analysis[open] summary { margin-bottom: 12px; }
.analysis-empty { margin-bottom: 12px; color: var(--text-2); font-size: 13px; }
.field { display: grid; gap: 6px; margin: 0 0 12px; }
fieldset.field { min-width: 0; padding: 0; border: 0; }
fieldset.field legend { padding: 0; margin-bottom: 6px; }
.field-label { color: var(--text-2); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-button { min-height: 30px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--raised); font-size: 13px; }
.chip-button:hover { border-color: var(--border-strong); }
.chip-button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.segment { display: inline-flex; flex-wrap: wrap; width: fit-content; max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.segment label { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; font-size: 13px; cursor: pointer; }
.segment label + label { border-left: 1px solid var(--border); }
.segment input { position: absolute; opacity: 0; pointer-events: none; }
.segment label:has(input:checked) { background: var(--primary); color: var(--on-primary); }
.segment label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }
.form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* ---------- 检查器：当前项目、分集 ---------- */
.details-panel { display: flex; flex-direction: column; gap: 14px; }
.inspector-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.identity h3 { font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.platform-mark { display: inline-block; margin-top: 4px; color: var(--text-3); font-size: 12px; }
.media-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.media-meta dt { color: var(--text-3); font-size: 12px; }
.media-meta dd { font-size: 13px; }
.status { color: var(--text-2); font-size: 12px; }
.project-box { padding-top: 12px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
.episodes { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
.episodes-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.episodes-head h3 { font-size: 13px; font-weight: 600; }
.learned-count { color: var(--text-2); font-size: 12px; white-space: nowrap; }
.progress { height: 4px; overflow: hidden; border-radius: 2px; background: var(--border); }
.progress i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.episodes-next { color: var(--text-2); font-size: 12px; overflow-wrap: anywhere; }
.episodes-next b { color: var(--text); font-weight: 600; }
.episodes-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.episodes-toggle { display: none; }
.episode-list { position: relative; display: flex; flex-direction: column; gap: 2px; max-height: min(460px, 52vh); margin: 0 -6px; padding: 2px; overflow-y: auto; list-style: none; overscroll-behavior: contain; }
.episode { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; gap: 8px; padding: 0 6px; border-radius: var(--radius-md); }
.episode.current { background: var(--sunken); box-shadow: inset 2px 0 0 var(--primary); }
.episode-open { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 34px; padding: 0; border: 0; background: transparent; text-align: left; }
.episode-open:hover .ep-title { text-decoration: underline; text-underline-offset: 3px; }
.ep-no { color: var(--text-3); font-family: var(--font-mono); font-size: 12px; }
.ep-title { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.ep-meta { color: var(--text-3); font-size: 11px; white-space: nowrap; }
.episode.learned .ep-title { color: var(--text-2); }
.episode.current .ep-title { font-weight: 600; color: var(--text); }

/* ---------- 占位页、提示、弹窗 ---------- */
.placeholder-card { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; max-width: 620px; margin: 40px auto; padding: 32px; border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); background: var(--surface); }
.placeholder-card h2 { font-size: 22px; }
.toast-region { position: fixed; bottom: 20px; left: calc(var(--sidebar-w) + 20px); z-index: 70; display: flex; flex-direction: column; gap: 8px; width: min(400px, calc(100vw - var(--sidebar-w) - 40px)); pointer-events: none; }
.toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 12px 14px; border-radius: var(--radius-lg); background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-lg); font-size: 13px; pointer-events: auto; }
.toast-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast-close { display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--on-primary); }
dialog { width: min(480px, calc(100vw - 24px)); padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--raised); color: var(--text); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: var(--overlay); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.dialog-head h2 { font-size: 15px; font-weight: 600; }
.dialog-body { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }

/* ---------- 响应式 ----------
   AI 分析：宽屏时检查器在右侧；不足 1360 像素时，紧凑检查器移到上方，把宽度让给「视频 | 笔记」。
   860 像素及以下：视频固定在顶部，笔记在下方滚动。 */
@media (max-width: 1359px) {
  .work-grid.ai { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .work-grid.ai .preview-panel { grid-row: 2; }
  .work-grid.ai .details-panel { grid-row: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: start; column-gap: 20px; }
  .work-grid.ai .details-panel .panel-title { display: none; }
  .work-grid.ai .episodes { padding-top: 0; border-top: 0; }
  .work-grid.ai .episodes-toggle { display: inline-flex; }
  .work-grid.ai .episodes:not(.open) .episode-list { display: none; }
}
@media (max-width: 1170px) {
  :root { --sidebar-w: 186px; --inspector-w: 262px; --pad-x: 24px; }
  .brand { gap: 8px; font-size: 14px; white-space: nowrap; }
  .work-grid.full { gap: 18px; }
}
@media (max-width: 1000px) {
  .work-grid.full { grid-template-columns: minmax(0, 1fr); }
  .work-grid.full .episodes-toggle { display: inline-flex; }
  .work-grid.full .episodes:not(.open) .episode-list { display: none; }
}
@media (max-width: 860px) {

  /* ---------- 简易 Markdown：标题、列表、段落；[mm:ss] 时间点变成跳转按钮 ---------- */
  function inline(text, duration) {
    return esc(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[(?:(\d{1,2}):)?(\d{1,2}):(\d{2})\]/g, (match, h, m, s) => {
        const t = Number(h || 0) * 3600 + Number(m) * 60 + Number(s);
        if (t > duration) return match;
        return `<button type="button" class="time-link" data-seek="${t}" aria-label="跳到 ${fmt(t)}">${fmt(t)}</button>`;
      });
  }
  function markdown(text, duration) {
    const out = [];
    let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    const open = (tag) => { if (list !== tag) { close(); out.push(`<${tag}>`); list = tag; } };
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      let m;
      if (!line) close();
      else if ((m = line.match(/^##\s+(.*)$/))) { close(); out.push(`<h4>${inline(m[1], duration)}</h4>`); }
      else if ((m = line.match(/^-\s+(.*)$/))) { open('ul'); out.push(`<li>${inline(m[1], duration)}</li>`); }
      else if ((m = line.match(/^\d+\.\s+(.*)$/))) { open('ol'); out.push(`<li>${inline(m[1], duration)}</li>`); }
      else { close(); out.push(`<p>${inline(line, duration)}</p>`); }
    }
    close();
    return out.join('');
  }

      if (el && el !== document.activeElement && el.getClientRects().length) el.focus({ preventScroll: true });
    }
  }

      </div>

  /* 只更新已学完相关的显示，不重绘：焦点和列表滚动位置保持不变 */
  function syncLearned() {
    const n = S.learned.size;
    const next = nextUnlearned();
    document.querySelectorAll('[data-learned]').forEach((box) => { box.checked = S.learned.has(Number(box.dataset.learned)); });
    document.querySelectorAll('.episode').forEach((row) => row.classList.toggle('learned', S.learned.has(Number(row.dataset.row))));
    if (!$('learned-count')) return;
    $('learned-count').textContent = `已学完 ${n} / ${TOTAL}`;
    $('learned-bar').style.width = `${((n / TOTAL) * 100).toFixed(2)}%`;
    $('episodes-next').innerHTML = next ? `学到 <b>P${next} ${esc(ep(next).title)}</b>` : `<b>${TOTAL} 讲全部学完</b>`;
    const cont = $('continue-button');
    cont.hidden = !next || next === S.p;
    cont.textContent = next ? `继续学 P${next}` : '';
  }

  function syncAnalyzeButton() {
    const b = $('analyze-button');
    if (!b) return;
    const busy = S.archiving.has(S.p) ? '归档中…' : S.analyzing.has(S.p) ? '分析中…' : '';
    if (busy) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    b.innerHTML = busy ? `${icon('loader', 'spin')}${busy}` : `${icon(S.archived.has(S.p) ? 'scan-eye' : 'download')}${S.archived.has(S.p) ? '开始分析' : '归档并分析'}`;
  }

  function renderPlayer() {
    syncLearned();
    syncAnalyzeButton();
    const e = ep(S.p);
    const fill = $('track-fill');
    if (!fill) return;
    const text = `${fmt(S.time)} / ${fmt(e.duration)}`;
    $('player-time').textContent = text;
    $('screen-time').textContent = fmt(S.time);
    fill.style.width = `${((S.time / e.duration) * 100).toFixed(2)}%`;
    const track = $('player-track');
    track.setAttribute('aria-valuenow', String(Math.round(S.time)));
    track.setAttribute('aria-valuetext', text);
    const play = $('play-button');
    play.innerHTML = icon(S.playing ? 'pause' : 'play');
    play.setAttribute('aria-label', S.playing ? '暂停' : '播放');
  }

  function scrollListToCurrent() {
    const list = $('episode-list');
    const row = list && list.querySelector('.current');
    if (row && list.clientHeight) list.scrollTop = row.offsetTop - (list.clientHeight - row.offsetHeight) / 2;
  }

  /* ---------- 播放演示 ---------- */
  let timer = null;
  function pause() {
    S.playing = false;
    clearInterval(timer);
    timer = null;
    renderPlayer();
  }
  function play() {
    if (S.time >= ep(S.p).duration) S.time = 0;
    S.playing = true;
    timer = setInterval(() => {
      S.time = Math.min(ep(S.p).duration, S.time + 1);
      if (S.time >= ep(S.p).duration) pause();
      else renderPlayer();
    }, 1000);
    renderPlayer();
  }
  function seek(t, quiet = false) {
    S.time = Math.max(0, Math.min(ep(S.p).duration, t));
    renderPlayer();
    if (!quiet) announce(`视频已跳到 ${fmt(S.time)}，笔记保持不动`);
  }

  /* ---------- 动作 ---------- */
  function listCollapsible() {
    const toggle = $('episodes-toggle');
    return !!toggle && getComputedStyle(toggle).display !== 'none';
  }

  function focusFirst(...elements) {
    const el = elements.find((x) => x && x.getClientRects().length);
    if (el) el.focus({ preventScroll: true });
  }

  function selectEpisode(p, { focusTitle = false } = {}) {
    if (!ep(p) || p === S.p) return;
    const collapse = listCollapsible() && S.listOpen;
    pause();
    S.p = p;
    S.time = 0;
    S.newOpen = null;
    if (collapse) S.listOpen = false;
    render();
    scrollListToCurrent();
    if (focusTitle || collapse) focusFirst($('episode-title'), document.querySelector(`[data-open="${p}"]`), $('episodes-toggle'));
    announce(`已切换到 P${p} ${ep(p).title}`);
  }

  function setLearned(p, value) {
    if (value) S.learned.add(p); else S.learned.delete(p);
    syncLearned();
    announce(`P${p} ${value ? '已标记为已学完' : '已取消已学完'}。已学完 ${S.learned.size} / ${TOTAL}`);
  }

  function setTab(tab, focus = false) {
    if (S.tab !== tab) {
      S.tab = tab;
      render();
    }
    if (focus) $(`tab-${tab}`).focus();
  }

  function archive(p, then) {
    if (S.archived.has(p) || S.archiving.has(p)) return;
    S.archiving.set(p, 0);
    if (S.p === p) render();
    const step = () => {
      const v = Math.min(100, S.archiving.get(p) + 25);
      if (v < 100) {
        S.archiving.set(p, v);
        if (S.p === p && $('stage-progress-bar')) {
          $('stage-progress-bar').style.width = `${v}%`;
          $('stage-progress-text').textContent = `正在下载（示例）· ${v}%`;
        }
        setTimeout(step, 220);
        return;
      }
      S.archiving.delete(p);
      S.archived.add(p);
      const hadFocus = document.activeElement && document.activeElement.dataset.focusKey === 'archive';
      if (S.p === p) {
        render();
        if (hadFocus) focusFirst($('play-button'), $('analyze-button'));
      }
      else document.querySelectorAll(`[data-open="${p}"] .ep-meta`).forEach((m) => { m.textContent = fmt(ep(p).duration); });
      toast(`P${p} 已归档（原型模拟，没有下载）。`);
      if (then) then();
    };
    setTimeout(step, 220);
  }

  function analyze() {
    const p = S.p;
    if (S.analyzing.has(p) || S.archiving.has(p)) return;
    const run = () => {
      const tpl = S.form.template;
      const prompt = S.form.prompt.trim();
      S.analyzing.add(p);
      syncAnalyzeButton();
      setTimeout(() => {
        S.analyzing.delete(p);
        S.seq += 1;
        const r = record(`r${p}-new${S.seq}`, tpl, stamp(), generatedText(p, tpl), { prompt });
        S.records[p] = [r, ...recordsOf(p)];
        S.active[p] = r.id;
        if (S.p === p) {
          const lostFocus = !document.activeElement || document.activeElement === document.body || document.activeElement.dataset.focusKey === 'analyze';
          S.newOpen = false;
          render();
          if (lostFocus && $('records-title')) $('records-title').focus({ preventScroll: true });
        }
        toast(`P${p} 的「${r.name}」已生成（示例内容）。`);
        announce(`P${p} 的${r.name}已生成，显示在视频旁边`);
      }, 900);
    };
    if (!S.archived.has(p)) archive(p, run);
    else run();
  }

  function ask(form) {
    const input = form.querySelector('textarea');
    const q = input.value.trim();
    const r = activeRecord();
    if (!q || !r) return;
    const t = Math.min(ep(S.p).duration - 60, 600);
    r.followups.push({ q, a: `（示例回答）这里显示模型对「${q}」的回答。回答里的时间点同样可以点击，例如 [${fmt(t)}]。` });
    render();
    announce('追问已添加（示例回答）');
  }

  /* ---------- 导航与菜单 ---------- */
  const TITLES = { workspace: '视频工作台', transcription: '字幕与转写', tasks: '任务中心', accounts: '账号与登录' };
  function go(page, { focusTitle = false } = {}) {
    if (page !== 'workspace') pause();
    S.page = page;
    document.querySelectorAll('[data-page-section]').forEach((sec) => { sec.hidden = sec.dataset.pageSection !== page; });
    document.querySelectorAll('#nav [data-page]').forEach((b) => {
      if (b.dataset.page === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('page-title').textContent = TITLES[page];
    if (S.menuOpen) setMenu(false);
    window.scrollTo(0, 0);
    if (focusTitle) $('page-title').focus({ preventScroll: true });
  }

  function syncInert() {
    const mobile = mobileQuery.matches;
    $('sidebar').inert = mobile && !S.menuOpen;
    $('shell').inert = mobile && S.menuOpen;
    if (mobile && S.menuOpen) {
      $('sidebar').setAttribute('role', 'dialog');
      $('sidebar').setAttribute('aria-modal', 'true');
    } else {
      $('sidebar').removeAttribute('role');
      $('sidebar').removeAttribute('aria-modal');
    }
  }

  function setMenu(open, restoreFocus = false) {
    S.menuOpen = open;
    $('sidebar').classList.toggle('open', open);
    $('nav-scrim').hidden = !open;
    $('menu-button').setAttribute('aria-expanded', String(open));
    syncInert();
    if (open) ($('sidebar').querySelector('[aria-current="page"]') || $('sidebar').querySelector('button')).focus();
    else if (restoreFocus) $('menu-button').focus();
  }

  /* ---------- 提示、弹窗、主题 ---------- */
  function announce(message) {
    const el = $('sr-status');
    el.textContent = '';
    setTimeout(() => { el.textContent = message; }, 30);
  }

  function toast(message) {
    const region = $('toast-region');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `${icon('info')}<p class="toast-text"></p><button type="button" class="toast-close" aria-label="关闭提示">${icon('x')}</button>`;
    el.querySelector('.toast-text').textContent = message;
    el.querySelector('.toast-close').addEventListener('click', () => el.remove());
    region.append(el);
    while (region.children.length > 2) region.firstElementChild.remove();
    setTimeout(() => el.remove(), 5000);
  }

  let opener = null;
  function openDialog(id) {
    opener = document.activeElement;
    $(id).showModal();
    $(id).querySelector('.dialog-foot button').focus();
  }

  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const b = $('theme-button');
    b.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
    b.setAttribute('aria-label', theme === 'dark' ? '切换到浅色主题' : '切换到深色主题');
    b.title = theme === 'dark' ? '浅色主题' : '深色主题';
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', (event) => {
    const t = event.target.closest('button');
    if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
    const d = t.dataset;
    if (d.page) return go(d.page, { focusTitle: true });
    if (d.go) return go(d.go, { focusTitle: true });
    if (d.closeDialog != null) return t.closest('dialog').close();
    if (d.tab) return setTab(d.tab);
    if (d.seek != null) return seek(Number(d.seek));
    if (d.open) return selectEpisode(Number(d.open));
    if (d.template) {
      S.form.template = d.template;
      S.form.source = template(d.template).source;
      document.querySelectorAll('[data-template]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.template === d.template)));
      document.querySelectorAll('input[name="analysis-source"]').forEach((r) => { r.checked = r.value === S.form.source; });
      $('tpl-desc').textContent = template(d.template).desc;
      return undefined;
    }
    switch (d.action || t.id) {
      case 'toggle-play': return S.playing ? pause() : play();
      case 'continue': return selectEpisode(nextUnlearned(), { focusTitle: true });
      case 'toggle-list':
        S.listOpen = !S.listOpen;
        $('episodes').classList.toggle('open', S.listOpen);
        t.setAttribute('aria-expanded', String(S.listOpen));
        t.textContent = S.listOpen ? '收起分集列表' : '展开分集列表';
        if (S.listOpen) scrollListToCurrent();
        return undefined;
      case 'archive': return archive(S.p);
      case 'analyze': return analyze();
      case 'file': return toast('原型不生成文件；正式应用里这里复制或导出这条记录。');
      case 'menu-button': return setMenu(!S.menuOpen);
      case 'nav-scrim': return setMenu(false, true);
      case 'settings-button': return openDialog('settings-dialog');
      case 'theme-button': return setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      default: return undefined;
    }
  });

  document.addEventListener('change', (event) => {
    const t = event.target;
    if (t.dataset.learned) return setLearned(Number(t.dataset.learned), t.checked);
    if (t.id === 'record-select') {
      S.active[S.p] = t.value;
      return render();
    }
    if (t.name === 'analysis-source') S.form.source = t.value;
    return undefined;
  });

  document.addEventListener('input', (event) => {
    if (event.target.id === 'prompt') S.form.prompt = event.target.value;
  });

  document.addEventListener('submit', (event) => {
    event.preventDefault();
    if (event.target.id === 'ask-form') return ask(event.target);
    if (event.target.id === 'source-form') toast('原型不联网解析；示例课程已经载入。');
    return undefined;
  });

  $('tabpanel').addEventListener('pointerdown', (event) => {
    const track = event.target.closest('#player-track');
    if (!track) return;
    const box = track.getBoundingClientRect();
    seek(((event.clientX - box.left) / box.width) * ep(S.p).duration, true);
  });

  document.addEventListener('keydown', (event) => {
    const t = event.target;
    if (t.getAttribute && t.getAttribute('role') === 'tab') {
      const order = ['cover', 'video', 'ai'];
      const i = order.indexOf(t.dataset.tab);
      const next = { ArrowRight: (i + 1) % 3, ArrowLeft: (i + 2) % 3, Home: 0, End: 2 }[event.key];
      if (next != null) { event.preventDefault(); setTab(order[next], true); }
      return;
    }
    if (t.id === 'player-track') {
      const step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[event.key];
      if (step) { event.preventDefault(); seek(S.time + step, true); }
      if (event.key === 'Home') { event.preventDefault(); seek(0, true); }
      if (event.key === 'End') { event.preventDefault(); seek(ep(S.p).duration, true); }
      return;
    }
    if (t.id === 'ask-input' && (event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      event.preventDefault();
      ask(t.form);
      return;
    }
    if (event.key === 'Escape' && S.menuOpen) setMenu(false, true);
  });

  $('settings-dialog').addEventListener('close', () => { if (opener) opener.focus(); });
  $('settings-dialog').addEventListener('click', (event) => { if (event.target === event.currentTarget) event.currentTarget.close(); });
  mobileQuery.addEventListener('change', () => { if (!mobileQuery.matches && S.menuOpen) setMenu(false); syncInert(); });

  /* ---------- 启动 ---------- */
  document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon); });
  setTheme('light');
  go('workspace');
  render();
  scrollListToCurrent();
  syncInert();
  window.__prototype = { get state() { return S; } };
})();
</script>
</body>
</html>
